<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F6F3EE" />
    <title>Sem conexão · Aura</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; background: #f6f3ee; color: #2a2622; text-align: center; }
      @media (prefers-color-scheme: dark) { body { background: #1f1d1a; color: #ede6dc; } p { color: #b8afa4; } }
      main { max-width: 22rem; }
      h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .5rem; }
      p { margin: 0 0 1.25rem; line-height: 1.5; color: #6b635b; }
      button { font: inherit; font-weight: 600; padding: .7rem 1.4rem; border-radius: 999px; border: 0; background: #2a2622; color: #fffdf9; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>O Aura precisa de internet para abrir as suas tarefas e a sua rotina. Quando a conexão voltar, tente de novo.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
